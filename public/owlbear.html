<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>PTU Pokemon Generator</title>
    <link rel="icon" href="https://ptu-gen.sewef.workers.dev/logo.png" type="image/png">
    <link rel="stylesheet" href="owlbear.css">
</head>
<body>
    <main class="extension-shell">
        <header class="extension-header">
            <button class="extension-brand" id="tab-home" data-tab-id="home" type="button" role="tab" aria-selected="true" aria-controls="panel-home" aria-label="Open PTU Gen home">
                <img src="https://ptu-gen.sewef.workers.dev/logo.png" alt="" width="24" height="24">
                <span>PTU Gen</span>
            </button>
            <nav id="tabList" class="tab-list" aria-label="Pokemon tabs" role="tablist"></nav>
        </header>

        <section id="panelList" class="panel-list">
            <div class="extension-panel is-active" id="panel-home" data-panel-id="home" role="tabpanel" aria-labelledby="tab-home">
                <iframe src="index.html?owlbear=true" title="PTU Pokemon generator"></iframe>
            </div>
        </section>
    </main>
    <script src="pokemon-storage.js"></script>
    <script src="owlbear.js"></script>
</body>
</html>
