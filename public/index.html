<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTU Pokemon Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 PTU Pokémon Generator</h1>
            <p>Generate Pokémon with customized stats</p>
        </div>

        <div class="content">
            <!-- Form -->
            <div class="panel">
                <h2>⚙️ Settings</h2>
                <form id="generatorForm" autocomplete="off">
                    <!-- Dataset -->
                    <div class="form-group">
                        <label>Dataset</label>
                        <select id="dataset">
                            <option value="core">Core</option>
                            <option value="community">Community</option>
                            <option value="homebrew">Homebrew</option>
                        </select>
                    </div>

                    <!-- Number of Pokémons -->
                    <div class="form-group">
                        <label>Generate Multiple Pokémons</label>
                        <input type="number" id="pokemonCount" min="1" max="50" value="1" autocomplete="off">
                    </div>

                    <!-- Level -->
                    <div class="form-group">
                        <label>Level</label>
                        <div class="form-row">
                            <div>
                                <label style="font-size: 0.85em; margin-bottom: 3px;">Specific Level</label>
                                <input type="number" id="level" min="1" max="100" value="50" placeholder="or leave empty" autocomplete="off">
                            </div>
                            <div>
                                <label style="font-size: 0.85em; margin-bottom: 3px;">Random Range</label>
                                <input type="checkbox" id="useRange" style="width: auto; margin-top: 10px;">
                                <span style="font-size: 0.85em; margin-left: 5px;">Range?</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-row" id="rangeInputs" style="display: none;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Min Level</label>
                            <input type="number" id="minLevel" min="1" max="100" value="30" autocomplete="off">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Max Level</label>
                            <input type="number" id="maxLevel" min="1" max="100" value="70" autocomplete="off">
                        </div>
                    </div>

                    <!-- Species -->
                    <div class="form-group form-group-autocomplete">
                        <label>Species (Pokémon)</label>
                        <input type="text" id="species" placeholder="ex: Pikachu, Charizard, Dragonite..." value="" autocomplete="off">
                        <div class="autocomplete-suggestions" id="speciesSuggestions"></div>
                    </div>

                    <!-- Shiny -->
                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="shiny" style="width: auto;">
                            <span>Shiny</span>
                        </label>
                    </div>

                    <!-- Distribution -->
                    <div class="form-group">
                        <label>Stat Distribution</label>
                        <select id="distribution">
                            <option value="RANDOM">Random (RANDOM)</option>
                            <option value="BALANCED">Balanced (BALANCED)</option>
                            <option value="MINMAXED">Extremes (MINMAXED)</option>
                        </select>
                    </div>

                    <!-- Nature -->
                    <div class="form-group">
                        <label>Nature</label>
                        <select id="nature">
                            <option value="">Random Nature</option>
                        </select>
                    </div>

                    <!-- Advanced Section -->
                    <div class="advanced-toggle" onclick="toggleAdvanced()">
                        <span>⚡ Advanced Settings</span>
                        <span class="toggle-icon" id="toggleIcon">▼</span>
                    </div>

                    <div class="advanced-section" id="advancedSection">
                        <div class="advanced-content">
                            <!-- Ignore Base Relation -->
                            <div class="form-group">
                                <label>Ignore Base Relation</label>
                                <input type="text" id="ignoreBaseRelation" placeholder="ex: IGNORE or HP,ATK,DEF" autocomplete="off">
                            </div>

                            <!-- HP Formula -->
                            <div class="form-group">
                                <label>Hit Points Formula</label>
                                <input type="text" id="hpFormula" placeholder="ex: LEVEL + (HP * 3) + 10" value="LEVEL + (HP * 3) + 10" autocomplete="off">
                                <small style="display: block; margin-top: 5px; color: #666;">Use LEVEL and HP as placeholders</small>
                            </div>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="button-group">
                        <button type="submit" class="btn-generate">🎲 Generate Pokémon</button>
                        <button type="reset" class="btn-reset">↻ Reset</button>
                    </div>
                </form>
            </div>

            <!-- Pokémon Display -->
            <div class="panel">
                <h2>📊 Generated Pokémon</h2>
                <div id="pokemonDisplay" class="no-pokemon">
                    Click "Generate Pokémon" to start
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPokemon = [];
        let selectedSuggestionIndex = -1;

        const form = document.getElementById('generatorForm');
        const useRangeCheckbox = document.getElementById('useRange');
        const rangeInputs = document.getElementById('rangeInputs');
        const levelInput = document.getElementById('level');
        const pokemonDisplay = document.getElementById('pokemonDisplay');
        const speciesInput = document.getElementById('species');
        const suggestionsList = document.getElementById('speciesSuggestions');
        const datasetSelect = document.getElementById('dataset');

        // Load Pokémon list for a specific dataset
        async function loadPokemonList(dataset = 'core') {
            try {
                const response = await fetch(`/api/pokemon/list?dataset=${dataset}`);
                if (response.ok) {
                    const data = await response.json();
                    allPokemon = data.species.map(name => ({
                        name: name,
                        searchName: name.toLowerCase()
                    }));
                    console.log(`✓ Loaded ${allPokemon.length} species from ${dataset} dataset`);
                    // Clear species input when dataset changes
                    speciesInput.value = '';
                    suggestionsList.classList.remove('open');
                    suggestionsList.innerHTML = '';
                }
            } catch (error) {
                console.error('Failed to load Pokémon list:', error);
            }
        }

        // Autocomplete logic
        speciesInput.addEventListener('input', function() {
            const value = this.value.trim().toLowerCase();
            selectedSuggestionIndex = -1;

            if (value.length === 0) {
                suggestionsList.classList.remove('open');
                suggestionsList.innerHTML = '';
                return;
            }

            if (allPokemon.length === 0) {
                console.warn('Pokemon list not loaded yet');
                return;
            }

            const filtered = allPokemon.filter(p => 
                p.searchName.includes(value)
            ).slice(0, 10);

            if (filtered.length === 0) {
                suggestionsList.classList.remove('open');
                suggestionsList.innerHTML = '';
                return;
            }

            suggestionsList.innerHTML = filtered.map((pokemon, index) => `
                <div class="autocomplete-item" data-index="${index}" data-name="${pokemon.name}">
                    ${pokemon.name}
                </div>
            `).join('');

            suggestionsList.classList.add('open');

            // Add click handlers
            document.querySelectorAll('.autocomplete-item').forEach((item, index) => {
                item.addEventListener('click', function() {
                    speciesInput.value = this.dataset.name;
                    suggestionsList.classList.remove('open');
                    speciesInput.focus();
                });
                item.addEventListener('mouseenter', function() {
                    selectedSuggestionIndex = index;
                    updateSuggestionSelection(document.querySelectorAll('.autocomplete-item'));
                });
            });
        });

        // Keyboard navigation for suggestions
        speciesInput.addEventListener('keydown', function(e) {
            const items = document.querySelectorAll('.autocomplete-item');
            
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, items.length - 1);
                updateSuggestionSelection(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
                updateSuggestionSelection(items);
            } else if (e.key === 'Enter') {
                if (selectedSuggestionIndex >= 0 && items[selectedSuggestionIndex]) {
                    e.preventDefault();
                    speciesInput.value = items[selectedSuggestionIndex].dataset.name;
                    suggestionsList.classList.remove('open');
                }
            } else if (e.key === 'Escape') {
                suggestionsList.classList.remove('open');
            }
        });

        function updateSuggestionSelection(items) {
            items.forEach((item, index) => {
                if (index === selectedSuggestionIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        // Close suggestions when clicking outside
        document.addEventListener('click', function(e) {
            if (e.target !== speciesInput && !e.target.closest('.autocomplete-suggestions')) {
                suggestionsList.classList.remove('open');
            }
        });

        // Reload species list when dataset changes
        datasetSelect.addEventListener('change', function() {
            loadPokemonList(this.value);
        });

        // Disable browser autocomplete on all inputs
        const allInputs = document.querySelectorAll('input, select');
        allInputs.forEach(input => {
            input.setAttribute('autocomplete', 'off');
            // Prevent Firefox from auto-filling
            input.addEventListener('change', function() {
                this.blur();
                this.focus();
            });
        });

        // Toggle level range
        useRangeCheckbox.addEventListener('change', function() {
            if (this.checked) {
                rangeInputs.style.display = 'grid';
                levelInput.disabled = true;
                levelInput.style.opacity = '0.5';
            } else {
                rangeInputs.style.display = 'none';
                levelInput.disabled = false;
                levelInput.style.opacity = '1';
            }
        });

        // Submit form
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const count = parseInt(document.getElementById('pokemonCount').value) || 1;
            await generateMultiplePokemon(count);
        });

        async function generateMultiplePokemon(count) {
            try {
                pokemonDisplay.innerHTML = '<div class="loading"><div class="spinner"></div>Generating ' + count + ' Pokémon...</div>';

                const pokemons = [];
                for (let i = 0; i < count; i++) {
                    try {
                        // Build URL
                        const params = new URLSearchParams();

                        if (useRangeCheckbox.checked) {
                            if (document.getElementById('minLevel').value) {
                                params.append('minLevel', document.getElementById('minLevel').value);
                            }
                            if (document.getElementById('maxLevel').value) {
                                params.append('maxLevel', document.getElementById('maxLevel').value);
                            }
                        } else {
                            if (levelInput.value) {
                                params.append('level', levelInput.value);
                            }
                        }

                        if (document.getElementById('species').value) {
                            params.append('species', document.getElementById('species').value);
                        }

                        if (document.getElementById('shiny').checked) {
                            params.append('shiny', 'true');
                        }

                        params.append('distribution', document.getElementById('distribution').value);
                        params.append('dataset', document.getElementById('dataset').value);

                        if (document.getElementById('nature').value) {
                            params.append('nature', document.getElementById('nature').value);
                        }

                        if (document.getElementById('ignoreBaseRelation').value) {
                            params.append('ignoreBaseRelation', document.getElementById('ignoreBaseRelation').value);
                        }

                        if (document.getElementById('hpFormula').value) {
                            params.append('hpFormula', document.getElementById('hpFormula').value);
                        }

                        const response = await fetch(`/api/pokemon/generate?${params}`);
                        if (!response.ok) {
                            throw new Error('Failed to generate');
                        }

                        const pokemon = await response.json();
                        pokemons.push(pokemon);
                    } catch (err) {
                        console.error('Error generating pokemon', i, err);
                    }
                }

                displayMultiplePokemon(pokemons);
            } catch (error) {
                pokemonDisplay.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            }
        }

        function displayMultiplePokemon(pokemons) {
            let html = '<div class="pokemon-cards-grid">';
            
            pokemons.forEach((pokemon, index) => {
                const typesHtml = pokemon.types.map(type => 
                    `<span class="pokemon-card-type type-${type.toLowerCase().replace(' ', '-')}">${type}</span>`
                ).join('');

                html += `
                    <div class="pokemon-card" onclick="openPokemonDetail(${index})">
                        <div class="pokemon-card-number">#${pokemon.id}</div>
                        <div class="pokemon-card-name">${pokemon.name}</div>
                        <div class="pokemon-card-level">Lvl ${pokemon.level}</div>
                        <div class="pokemon-card-types">${typesHtml}</div>
                        ${pokemon.shiny ? '<div class="pokemon-card-shiny">✨ SHINY</div>' : ''}
                    </div>
                `;

                // Store pokemon data in sessionStorage
                sessionStorage.setItem(`pokemon_${index}`, JSON.stringify(pokemon));
            });

            html += '</div>';
            pokemonDisplay.innerHTML = html;

            // Store the count for reference
            sessionStorage.setItem('pokemon_count', pokemons.length);
        }

        function openPokemonDetail(index) {
            const pokemon = JSON.parse(sessionStorage.getItem(`pokemon_${index}`));
            if (pokemon) {
                // Store in localStorage for the new tab
                localStorage.setItem('selectedPokemon', JSON.stringify(pokemon));
                window.open('details.html', '_blank');
            }
        }

        function toggleAdvanced() {
            const section = document.getElementById('advancedSection');
            const icon = document.getElementById('toggleIcon');
            section.classList.toggle('open');
            icon.classList.toggle('open');
        }

        // Load available natures
        async function loadNatures() {
            try {
                const response = await fetch('/api/pokemon/natures');
                if (response.ok) {
                    const data = await response.json();
                    const natureSelect = document.getElementById('nature');
                    data.natures.forEach(nature => {
                        const option = document.createElement('option');
                        option.value = nature.name;
                        option.textContent = `${nature.name} (+${nature.raise} -${nature.lower})`;
                        natureSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Failed to load natures:', error);
            }
        }

        // Generate Pokémon on page load
        window.addEventListener('load', function() {
            loadPokemonList();
            loadNatures();
            // Optional: auto-generate
            // generatePokemon();
        });
    </script>
</body>
</html>
