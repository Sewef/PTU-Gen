<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTU Pokemon Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.95em;
            transition: border-color 0.3s;
        }

        /* Disable browser autocomplete suggestions */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px white inset !important;
            -webkit-text-fill-color: #333 !important;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .pokemon-display {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .pokemon-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .pokemon-title {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .pokemon-meta {
            font-size: 0.9em;
            color: #666;
        }

        .shiny-badge {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .pokemon-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .info-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.1em;
            color: #333;
        }

        .types {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .type-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
        }

        .type-normal { background: #A8A878; }
        .type-fire { background: #F08030; }
        .type-water { background: #6890F0; }
        .type-electric { background: #F8D030; color: #333; }
        .type-grass { background: #78C850; }
        .type-ice { background: #98D8D8; color: #333; }
        .type-fighting { background: #C03028; }
        .type-poison { background: #A040A0; }
        .type-ground { background: #E0C068; color: #333; }
        .type-flying { background: #A890F0; }
        .type-psychic { background: #F85888; }
        .type-bug { background: #A8B820; }
        .type-rock { background: #B8A038; }
        .type-ghost { background: #705898; }
        .type-dragon { background: #7038F8; }
        .type-dark { background: #705848; }
        .type-steel { background: #B8B8D0; color: #333; }
        .type-fairy { background: #EE99AC; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .stat-bar {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
        }

        .stat-name {
            font-weight: 600;
            color: #667eea;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .stat-value {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-number {
            font-weight: bold;
            font-size: 1.2em;
            min-width: 40px;
            color: #333;
        }

        .stat-progress {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
        }

        .abilities {
            margin: 20px 0;
        }

        .abilities-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .ability-list {
            display: grid;
            gap: 8px;
        }

        .ability {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 5px;
            border-left: 3px solid #764ba2;
            color: #333;
        }

        .moves {
            margin: 20px 0;
        }

        .moves-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .moves-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .move {
            background: #f0f0f0;
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #333;
        }

        .move-type {
            font-size: 0.75em;
            color: #666;
            margin-top: 2px;
        }

        .nature-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #764ba2;
            margin: 15px 0;
        }

        .nature-name {
            font-weight: 600;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 8px;
        }

        .nature-mods {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
        }

        .nature-raise {
            color: #28a745;
            font-weight: 600;
        }

        .nature-lower {
            color: #dc3545;
            font-weight: 600;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #dc3545;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .advanced-toggle {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            user-select: none;
        }

        .advanced-toggle:hover {
            background: #e0e0e0;
        }

        .advanced-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .advanced-section.open {
            max-height: 500px;
        }

        .advanced-content {
            padding: 15px 0;
            border-top: 1px solid #ddd;
            margin-top: 15px;
        }

        .toggle-icon {
            font-size: 1.2em;
            transition: transform 0.3s;
        }

        .toggle-icon.open {
            transform: rotate(180deg);
        }

        .form-group-autocomplete {
            position: relative;
            margin-bottom: 15px;
        }

        .autocomplete-suggestions {
            position: absolute;
            top: calc(100% + 3px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 0 0 5px 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .autocomplete-suggestions.open {
            display: block;
        }

        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background-color: #f0f0f0;
        }

        .autocomplete-item.selected {
            background-color: #e8e8ff;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .pokemon-info {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .moves-list {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }

        .no-pokemon {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 PTU Pokémon Generator</h1>
            <p>Generate Pokémon with customized stats</p>
        </div>

        <div class="content">
            <!-- Form -->
            <div class="panel">
                <h2>⚙️ Settings</h2>
                <form id="generatorForm" autocomplete="off">
                    <!-- Level -->
                    <div class="form-group">
                        <label>Level</label>
                        <div class="form-row">
                            <div>
                                <label style="font-size: 0.85em; margin-bottom: 3px;">Specific Level</label>
                                <input type="number" id="level" min="1" max="100" value="50" placeholder="or leave empty" autocomplete="off">
                            </div>
                            <div>
                                <label style="font-size: 0.85em; margin-bottom: 3px;">Random Range</label>
                                <input type="checkbox" id="useRange" style="width: auto; margin-top: 10px;">
                                <span style="font-size: 0.85em; margin-left: 5px;">Range?</span>
                            </div>
                        </div>
                    </div>

                    <!-- Dataset -->
                    <div class="form-group">
                        <label>Dataset</label>
                        <select id="dataset">
                            <option value="core">Core</option>
                            <option value="community">Community</option>
                            <option value="homebrew">Homebrew</option>
                        </select>
                    </div>

                    <div class="form-row" id="rangeInputs" style="display: none;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Min Level</label>
                            <input type="number" id="minLevel" min="1" max="100" value="30" autocomplete="off">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Max Level</label>
                            <input type="number" id="maxLevel" min="1" max="100" value="70" autocomplete="off">
                        </div>
                    </div>

                    <!-- Species -->
                    <div class="form-group form-group-autocomplete">
                        <label>Species (Pokémon)</label>
                        <input type="text" id="species" placeholder="ex: Pikachu, Charizard, Dragonite..." value="" autocomplete="off">
                        <div class="autocomplete-suggestions" id="speciesSuggestions"></div>
                    </div>

                    <!-- Shiny -->
                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="shiny" style="width: auto;">
                            <span>Shiny</span>
                        </label>
                    </div>

                    <!-- Distribution -->
                    <div class="form-group">
                        <label>Stat Distribution</label>
                        <select id="distribution">
                            <option value="RANDOM">Random (RANDOM)</option>
                            <option value="BALANCED">Balanced (BALANCED)</option>
                            <option value="MINMAXED">Extremes (MINMAXED)</option>
                        </select>
                    </div>

                    <!-- Advanced Section -->
                    <div class="advanced-toggle" onclick="toggleAdvanced()">
                        <span>⚡ Advanced Settings</span>
                        <span class="toggle-icon" id="toggleIcon">▼</span>
                    </div>

                    <div class="advanced-section" id="advancedSection">
                        <div class="advanced-content">
                            <!-- Ignore Base Relation -->
                            <div class="form-group">
                                <label>Ignore Base Relation</label>
                                <input type="text" id="ignoreBaseRelation" placeholder="ex: IGNORE or HP,ATK,DEF" autocomplete="off">
                            </div>

                            <!-- HP Formula -->
                            <div class="form-group">
                                <label>Hit Points Formula</label>
                                <input type="text" id="hpFormula" placeholder="ex: LEVEL + (HP * 3) + 10" value="LEVEL + (HP * 3) + 10" autocomplete="off">
                                <small style="display: block; margin-top: 5px; color: #666;">Use LEVEL and HP as placeholders</small>
                            </div>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="button-group">
                        <button type="submit" class="btn-generate">🎲 Generate Pokémon</button>
                        <button type="reset" class="btn-reset">↻ Reset</button>
                    </div>
                </form>
            </div>

            <!-- Pokémon Display -->
            <div class="panel">
                <h2>📊 Generated Pokémon</h2>
                <div id="pokemonDisplay" class="no-pokemon">
                    Click "Generate Pokémon" to start
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPokemon = [];
        let selectedSuggestionIndex = -1;

        const form = document.getElementById('generatorForm');
        const useRangeCheckbox = document.getElementById('useRange');
        const rangeInputs = document.getElementById('rangeInputs');
        const levelInput = document.getElementById('level');
        const pokemonDisplay = document.getElementById('pokemonDisplay');
        const speciesInput = document.getElementById('species');
        const suggestionsList = document.getElementById('speciesSuggestions');
        const datasetSelect = document.getElementById('dataset');

        // Load Pokémon list for a specific dataset
        async function loadPokemonList(dataset = 'core') {
            try {
                const response = await fetch(`/api/pokemon/list?dataset=${dataset}`);
                if (response.ok) {
                    const data = await response.json();
                    allPokemon = data.species.map(name => ({
                        name: name,
                        searchName: name.toLowerCase()
                    }));
                    console.log(`✓ Loaded ${allPokemon.length} species from ${dataset} dataset`);
                    // Clear species input when dataset changes
                    speciesInput.value = '';
                    suggestionsList.classList.remove('open');
                    suggestionsList.innerHTML = '';
                }
            } catch (error) {
                console.error('Failed to load Pokémon list:', error);
            }
        }

        // Autocomplete logic
        speciesInput.addEventListener('input', function() {
            const value = this.value.trim().toLowerCase();
            selectedSuggestionIndex = -1;

            if (value.length === 0) {
                suggestionsList.classList.remove('open');
                suggestionsList.innerHTML = '';
                return;
            }

            if (allPokemon.length === 0) {
                console.warn('Pokemon list not loaded yet');
                return;
            }

            const filtered = allPokemon.filter(p => 
                p.searchName.includes(value)
            ).slice(0, 10);

            if (filtered.length === 0) {
                suggestionsList.classList.remove('open');
                suggestionsList.innerHTML = '';
                return;
            }

            suggestionsList.innerHTML = filtered.map((pokemon, index) => `
                <div class="autocomplete-item" data-index="${index}" data-name="${pokemon.name}">
                    ${pokemon.name}
                </div>
            `).join('');

            suggestionsList.classList.add('open');

            // Add click handlers
            document.querySelectorAll('.autocomplete-item').forEach((item, index) => {
                item.addEventListener('click', function() {
                    speciesInput.value = this.dataset.name;
                    suggestionsList.classList.remove('open');
                    speciesInput.focus();
                });
                item.addEventListener('mouseenter', function() {
                    selectedSuggestionIndex = index;
                    updateSuggestionSelection(document.querySelectorAll('.autocomplete-item'));
                });
            });
        });

        // Keyboard navigation for suggestions
        speciesInput.addEventListener('keydown', function(e) {
            const items = document.querySelectorAll('.autocomplete-item');
            
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, items.length - 1);
                updateSuggestionSelection(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
                updateSuggestionSelection(items);
            } else if (e.key === 'Enter') {
                if (selectedSuggestionIndex >= 0 && items[selectedSuggestionIndex]) {
                    e.preventDefault();
                    speciesInput.value = items[selectedSuggestionIndex].dataset.name;
                    suggestionsList.classList.remove('open');
                }
            } else if (e.key === 'Escape') {
                suggestionsList.classList.remove('open');
            }
        });

        function updateSuggestionSelection(items) {
            items.forEach((item, index) => {
                if (index === selectedSuggestionIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        // Close suggestions when clicking outside
        document.addEventListener('click', function(e) {
            if (e.target !== speciesInput && !e.target.closest('.autocomplete-suggestions')) {
                suggestionsList.classList.remove('open');
            }
        });

        // Reload species list when dataset changes
        datasetSelect.addEventListener('change', function() {
            loadPokemonList(this.value);
        });

        // Disable browser autocomplete on all inputs
        const allInputs = document.querySelectorAll('input, select');
        allInputs.forEach(input => {
            input.setAttribute('autocomplete', 'off');
            // Prevent Firefox from auto-filling
            input.addEventListener('change', function() {
                this.blur();
                this.focus();
            });
        });

        // Toggle level range
        useRangeCheckbox.addEventListener('change', function() {
            if (this.checked) {
                rangeInputs.style.display = 'grid';
                levelInput.disabled = true;
                levelInput.style.opacity = '0.5';
            } else {
                rangeInputs.style.display = 'none';
                levelInput.disabled = false;
                levelInput.style.opacity = '1';
            }
        });

        // Submit form
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            await generatePokemon();
        });

        async function generatePokemon() {
            try {
                pokemonDisplay.innerHTML = '<div class="loading"><div class="spinner"></div>Generating...</div>';

                // Build URL
                const params = new URLSearchParams();

                if (useRangeCheckbox.checked) {
                    if (document.getElementById('minLevel').value) {
                        params.append('minLevel', document.getElementById('minLevel').value);
                    }
                    if (document.getElementById('maxLevel').value) {
                        params.append('maxLevel', document.getElementById('maxLevel').value);
                    }
                } else {
                    if (levelInput.value) {
                        params.append('level', levelInput.value);
                    }
                }

                if (document.getElementById('species').value) {
                    params.append('species', document.getElementById('species').value);
                }

                if (document.getElementById('shiny').checked) {
                    params.append('shiny', 'true');
                }

                params.append('distribution', document.getElementById('distribution').value);

                params.append('dataset', document.getElementById('dataset').value);

                if (document.getElementById('ignoreBaseRelation').value) {
                    params.append('ignoreBaseRelation', document.getElementById('ignoreBaseRelation').value);
                }

                if (document.getElementById('hpFormula').value) {
                    params.append('hpFormula', document.getElementById('hpFormula').value);
                }

                // API Call
                const response = await fetch(`/api/pokemon/generate?${params}`);
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Generation error');
                }

                const pokemon = await response.json();
                displayPokemon(pokemon);
            } catch (error) {
                pokemonDisplay.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            }
        }

        function displayPokemon(pokemon) {
            const typeClass = pokemon.types[0].toLowerCase().replace(' ', '-');
            const statsEntries = Object.entries(pokemon.stats);
            const maxStat = Math.max(...statsEntries.map(([_, v]) => v));

            let html = `
                <div class="pokemon-header">
                    <div>
                        <div class="pokemon-title">#${pokemon.id} ${pokemon.name}</div>
                        <div class="pokemon-meta">Level ${pokemon.level}</div>
                    </div>
                    ${pokemon.shiny ? '<div class="shiny-badge">✨ SHINY</div>' : ''}
                </div>

                <div class="pokemon-info">
                    <div class="info-box">
                        <div class="info-label">Type(s)</div>
                        <div class="types">
                            ${pokemon.types.map(type => `<span class="type-badge type-${type.toLowerCase().replace(' ', '-')}">${type}</span>`).join('')}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="info-label">Hit Points</div>
                        <div class="info-value">${pokemon.hitPoints} HP</div>
                    </div>

                    <div class="info-box">
                        <div class="info-label">Nature</div>
                        <div class="info-value">${pokemon.nature.name}</div>
                        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 8px;">
                            <span class="nature-raise">+${pokemon.nature.raise}</span>
                            <span class="nature-lower">-${pokemon.nature.lower}</span>
                        </div>
                    </div>
                </div>

                <h3 style="margin-top: 20px; margin-bottom: 15px; color: #667eea;">📈 Stats</h3>
                <div class="stats-grid">
                    ${statsEntries.map(([name, value]) => `
                        <div class="stat-bar">
                            <div class="stat-name">${name.toUpperCase()}</div>
                            <div class="stat-value">
                                <span class="stat-number">${value}</span>
                                <div class="stat-progress">
                                    <div class="stat-fill" style="width: ${(value / maxStat) * 100}%"></div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="abilities">
                    <div class="abilities-title">🎯 Abilities</div>
                    <div class="ability-list">
                        ${pokemon.abilities.map(ability => `<div class="ability">${ability}</div>`).join('')}
                    </div>
                </div>

                <div class="moves">
                    <div class="moves-title">⚔️ Moves</div>
                    <div class="moves-list">
                        ${pokemon.moves.map(move => `
                            <div class="move">
                                <div>${move.name}</div>
                                <div class="move-type">${move.type} (${move.method})</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${pokemon.capabilities.length > 0 ? `
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #f0f0f0;">
                        <h3 style="color: #667eea; margin-bottom: 10px;">🔧 Capabilities</h3>
                        <p style="color: #666; font-size: 0.9em;">${pokemon.capabilities.join(', ')}</p>
                    </div>
                ` : ''}
            `;

            pokemonDisplay.innerHTML = html;
        }

        function toggleAdvanced() {
            const section = document.getElementById('advancedSection');
            const icon = document.getElementById('toggleIcon');
            section.classList.toggle('open');
            icon.classList.toggle('open');
        }

        // Generate Pokémon on page load
        window.addEventListener('load', function() {
            loadPokemonList();
            // Optional: auto-generate
            // generatePokemon();
        });
    </script>
</body>
</html>
