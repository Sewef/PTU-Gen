, "electric": 1, "fairy": 1, "fighting": 2, "fire": 0.5, "flying": 0.5, "ghost": 1, "grass": 2, "ground": 2, "ice": 1, "normal": 0.5, "poison": 0.5, "psychic": 1, "rock": 1, "steel": 2, "water": 2}, "psychic": {"bug": 2, "dark": 2, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 0.5, "fire": 1, "flying": 1, "ghost": 2, "grass": 1, "ground": 1, "ice": 1, "normal": 1, "poison": 1, "psychic": 0.5, "rock": 1, "steel": 1, "water": 1}, "ice": {"bug": 1, "dark": 1, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 2, "fire": 2, "flying": 1, "ghost": 1, "grass": 1, "ground": 1, "ice": 0.5, "normal": 1, "poison": 1, "psychic": 1, "rock": 2, "steel": 2, "water": 1}, "bug": {"bug": 1, "dark": 1, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 0.5, "fire": 2, "flying": 2, "ghost": 1, "grass": 0.5, "ground": 0.5, "ice": 1, "normal": 1, "poison": 1, "psychic": 1, "rock": 2, "steel": 0.5, "water": 1}, "ghost": {"bug": 0.5, "dark": 2, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 0, "fire": 1, "flying": 1, "ghost": 2, "grass": 1, "ground": 1, "ice": 1, "normal": 0, "poison": 0.5, "psychic": 1, "rock": 1, "steel": 1, "water": 1}, "steel": {"bug": 0.5, "dark": 1, "dragon": 0.5, "electric": 1, "fairy": 0.5, "fighting": 2, "fire": 2, "flying": 0.5, "ghost": 1, "grass": 0.5, "ground": 2, "ice": 0.5, "normal": 0.5, "poison": 0, "psychic": 0.5, "rock": 0.5, "steel": 0.5, "water": 1}, "dragon": {"bug": 1, "dark": 1, "dragon": 2, "electric": 0.5, "fairy": 2, "fighting": 1, "fire": 0.5, "flying": 1, "ghost": 1, "grass": 0.5, "ground": 1, "ice": 2, "normal": 1, "poison": 1, "psychic": 1, "rock": 1, "steel": 1, "water": 0.5}, "dark": {"bug": 2, "dark": 0.5, "dragon": 1, "electric": 1, "fairy": 2, "fighting": 2, "fire": 1, "flying": 1, "ghost": 0.5, "grass": 1, "ground": 1, "ice": 1, "normal": 1, "poison": 1, "psychic": 0, "rock": 1, "steel": 1, "water": 1}, "fairy": {"bug": 0.5, "dark": 0.5, "dragon": 0, "electric": 1, "fairy": 1, "fighting": 0.5, "fire": 1, "flying": 1, "ghost": 1, "grass": 1, "ground": 1, "ice": 1, "normal": 1, "poison": 2, "psychic": 1, "rock": 1, "steel": 2, "water": 1}, "electric": {"bug": 1, "dark": 1, "dragon": 1, "electric": 0.5, "fairy": 1, "fighting": 1, "fire": 1, "flying": 0.5, "ghost": 1, "grass": 1, "ground": 2, "ice": 1, "normal": 1, "poison": 1, "psychic": 1, "rock": 1, "steel": 0.5, "water": 1}};


        function calculateTypeEffectiveness(types) {
            const effectiveness = {};
            const allTypes = ['normal', 'fire', 'water', 'electric', 'grass', 'ice', 'fighting', 'poison', 'ground', 'flying', 'psychic', 'bug', 'rock', 'ghost', 'dragon', 'dark', 'steel', 'fairy'];

            // Initialize all attacking types with 1x effectiveness
            allTypes.forEach(attackingType => {
                effectiveness[attackingType] = 1;
            });

            // For each attacking type, multiply effectiveness against each defending type
            allTypes.forEach(attackingType => {
                types.forEach(defendingType => {
                    const defendingTypeLower = defendingType.toLowerCase();
                    const defendingTypeData = typeEffectiveness[defendingTypeLower];
                    
                    if (!defendingTypeData) {
                        console.warn(`No type data for defending type: ${defendingTypeLower}`);
                        return;
                    }
                    
                    const eff = defendingTypeData[attackingType];
                    
                    if (eff === undefined) {
                        console.warn(`No effectiveness data for ${attackingType} vs ${defendingTypeLower}`);
                        return;
                    }
                    
                    effectiveness[attackingType] = effectiveness[attackingType] * eff;
                });
            });

            return effectiveness;
        }

        function displayTypeEffectiveness(pokemon) {
            // Get the actual types to use
            let typesToUse = pokemon.actualTypes || pokemon.types || [];
            
            // If types is a forme variant object, extract the actual types
            if (typesToUse.isFormeVariant) {
                const selectedForme = typesToUse.selectedForme;
                typesToUse = typesToUse.formes[selectedForme] || [];
            }
            
            console.log('displayTypeEffectiveness called with:', typesToUse);
            const effectiveness = calculateTypeEffectiveness(typesToUse);
            console.log('Effectiveness calculated:', effectiveness);
            const container = document.getElementById('typeEffectiveness');

            if (!container) return;

            container.innerHTML = '';

            const allTypes = ['Normal', 'Fire', 'Water', 'Electric', 'Grass', 'Ice', 'Fighting', 'Poison', 'Ground', 'Flying', 'Psychic', 'Bug', 'Rock', 'Ghost', 'Dragon', 'Dark', 'Steel', 'Fairy'];
            const midpoint = Math.ceil(allTypes.length / 2);
            const firstHalf = allTypes.slice(0, midpoint);
            const secondHalf = allTypes.slice(midpoint);

            // Create function to render a table half
            const renderHalf = (types) => {
                let html = `
                    <table style="width: 100%; border-collapse: collapse; font-size: 0.8em; margin-bottom: 8px;">
                        <tbody>
                            <tr style="border-bottom: 1px solid #ddd; height: 36px;">
                `;

                // First row: Type badges
                types.forEach(type => {
                    html += `
                        <td style="padding: 4px; text-align: center; border-right: 1px solid #ddd; vertical-align: middle;">
                            <span class="type-badge type-${type.toLowerCase().replace(' ', '-')}" style="display: inline-block; padding: 4px 8px; font-size: 0.7em; font-weight: 600; min-width: 50px; white-space: nowrap;">${type}</span>
                        </td>
                    `;
                });

                html += `
                            </tr>
                            <tr style="background: #fafafa; height: 30px;">
                `;

                // Second row: Effectiveness values
                types.forEach(type => {
                    let eff = effectiveness[type.toLowerCase()];
                    
                    // Apply multiplier only to 2x values
                    if (eff === 2 && currentTypeMultiplier !== 2) {
                        eff = 2 * (currentTypeMultiplier / 2);
                    }
                    
                    let effColor = '#333'; // Normal
                    let effText = '1x';
                    
                    // Format effectiveness with minimal decimals
                    const formatEff = (value) => {
                        if (value === 0) return '0x';
                        if (value === 1) return '1x';
                        if (Number.isInteger(value)) return value + 'x';
                        // Show minimal decimals (remove trailing zeros)
                        return parseFloat(value.toFixed(2)).toString() + 'x';
                    };

                    if (eff === 0) {
                        effColor = '#27ae60'; // Immune
                        effText = '0x';
                    } else if (eff <= 0.25) {
                        effColor = '#3498db'; // Strong resist
                        effText = formatEff(eff);
                    } else if (eff <= 0.5) {
                        effColor = '#5dade2'; // Resist
                        effText = formatEff(eff);
                    } else if (eff === 1) {
                        effColor = '#333';
                        effText = '1x';
                    } else if (eff <= 2) {
                        effColor = '#e67e22'; // Weak
                        effText = formatEff(eff);
                    } else {
                        effColor = '#e74c3c'; // Strong weak
                        effText = formatEff(eff);
                    }

                    html += `
                        <td style="padding: 4px; text-align: center; border-right: 1px solid #ddd; font-weight: 600; color: ${effColor}; font-size: 0.95em; vertical-align: middle;">
                            ${effText}
                        </td>
                    `;
                });

                html += `
                            </tr>
                        </tbody>
                    </table>
                `;

                return html;
            };

            container.innerHTML = renderHalf(firstHalf) + renderHalf(secondHalf);
        }

            document.getElementById('pokemonDisplay').innerHTML = html;

            // Combat Stage multipliers
            const csMultipliers = {
                '-6': 0.4, '-5': 0.5, '-4': 0.6, '-3': 0.7, '-2': 0.8, '-1': 0.9,
                '0': 1, '1': 1.2, '2': 1.4, '3': 1.6, '4': 1.8, '5': 2, '6': 2.2
            };

            // Generate detailed stats breakdown
            const statsBreakdownContainer = document.getElementById('statsBreakdown');
            let statsHTML = '';

            // Map short stat names to display names and back to baseStats keys
            const statDisplayNames = {
                'HP': 'HP',
                'atk': 'Attack',
                'def': 'Defense',
                'spA': 'Special Attack',
                'spD': 'Special Defense',
                'spe': 'Speed'
            };

            // Reverse map for looking up baseStats
            const baseStatsKeyMap = {
                'HP': 'HP',
                'atk': 'Attack',
                'def': 'Defense',
                'spA': 'Special Attack',
                'spD': 'Special Defense',
                'spe': 'Speed'
            };

            statsEntries.forEach(([statName, finalValue]) => {
                // Get base stat with nature applied from pokemon data
                let baseWithNature = pokemon.baseWithNature?.[statName] || 0;

                // Also get the raw base stat for display
                const baseStatKey = baseStatsKeyMap[statName];
                let baseStat = pokemon.baseStats?.[baseStatKey] || 0;

                // Calculate level points: finalValue - baseWithNature
                // finalValue = baseWithNature + levelPoints
                // so levelPoints = finalValue - baseWithNature
                let levelPoints = finalValue - baseWithNature;
                let cs = 0;

                const isHP = statName === 'HP';

                statsHTML += `
                    <div class="stat-breakdown-row" data-stat="${statName}">
                        <div class="stat-breakdown-label">${statDisplayNames[statName] || statName}</div>

                        ${!isHP ? `
                            <div class="stat-breakdown-component">

                                <input type="number" class="cs-input" data-stat="${statName}" min="-6" max="6" value="0" />

                        <div class="stat-breakdown-component total">

            statsBreakdownContainer.innerHTML = statsHTML;

            // Add event listeners for stat modifications
            document.querySelectorAll('.base-stat-input, .level-points-input, .cs-input').forEach(input => {
                input.addEventListener('change', function (e) {
                    updateStatTotal(e);
                    updateRemainingPoints(pokemon);

                // Also listen to 'input' event for real-time updates of remaining points
                if (input.classList.contains('level-points-input')) {
                    input.addEventListener('input', function (e) {

            // Initial update of remaining points
            updateRemainingPoints(pokemon);

            function updateStatTotal(e) {
                const statName = e.target.dataset.stat;
                const row = document.querySelector(`[data-stat="${statName}"]`);

                const baseInput = row.querySelector('.base-stat-input');
                const levelInput = row.querySelector('.level-points-input');
                const csInput = row.querySelector('.cs-input');

                let base = parseInt(baseInput?.value) || 0;
                let levelPts = parseInt(levelInput?.value) || 0;
                let cs = parseInt(csInput?.value) || 0;

                // Calculate total: (base + levelPts) * csMultiplier
                let subtotal = base + levelPts;
                let multiplier = csMultipliers[cs] || 1;
                let total = Math.floor(subtotal * multiplier);

                row.querySelector('.stat-total').textContent = total;
            }

            // Handle capability value changes
            document.querySelectorAll('.capability-value-input').forEach(input => {

        // Load available natures and setup dropdown
        async function setupNatureDropdown(pokemon) {
            try {
                const response = await fetch('/api/pokemon/natures');
                if (response.ok) {
                    const data = await response.json();
                    const natureSelect = document.getElementById('natureSelect');

                    // Clear existing options
                    natureSelect.innerHTML = '';

                    // Add options for each nature
                    data.natures.forEach(nature => {
                        const option = document.createElement('option');
                        option.value = nature.name;
                        option.textContent = `${nature.name} (+${nature.raise} -${nature.lower})`;
                        if (nature.name === pokemon.nature.name) {
                            option.selected = true;
                        }
                        natureSelect.appendChild(option);
                    });

                    // Add event listener for nature changes
                    natureSelect.addEventListener('change', function () {
                        const selectedNature = data.natures.find(n => n.name === this.value);
                        if (selectedNature) {
                            // Update nature display
                            document.getElementById('natureRaise').textContent = `+${selectedNature.raise}`;
                            document.getElementById('natureLower').textContent = `-${selectedNature.lower}`;

                            // Update pokemon object
                            pokemon.nature = selectedNature;

                            // Recalculate and update stats with new nature
                            updateStatsWithNature(selectedNature);
                        }
                    });
                }
            } catch (error) {
                console.error('Failed to load natures:', error);
            }
        }

        // Recalculate stats when nature changes
        function updateStatsWithNature(newNature) {
            const statsBreakdownContainer = document.getElementById('statsBreakdown');
            const statRows = statsBreakdownContainer.querySelectorAll('.stat-breakdown-row');

            const statNames = ['HP', 'atk', 'def', 'spA', 'spD', 'spe'];
            const statDisplayNames = {
                'HP': 'HP',
                'atk': 'Attack',
                'def': 'Defense',
                'spA': 'Special Attack',
                'spD': 'Special Defense',
                'spe': 'Speed'
            };

            statRows.forEach(row => {
                const statName = row.getAttribute('data-stat');
                const baseInput = row.querySelector('.base-stat-input');
                const levelInput = row.querySelector('.level-points-input');
                const csInput = row.querySelector('.cs-input');

                let base = parseInt(baseInput?.value) || 0;
                let levelPts = parseInt(levelInput?.value) || 0;
                let cs = parseInt(csInput?.value) || 0;

                // Apply nature modifier to base stat (for display purposes)
                let baseWithNature = base;
                if (statName === 'HP') {
                    if (newNature.raise === statName) baseWithNature += 1;
                    if (newNature.lower === statName) baseWithNature -= 1;
                } else {
                    if (newNature.raise === statName) baseWithNature += 2;
                    if (newNature.lower === statName) baseWithNature -= 2;
                }

                // Calculate total with nature applied
                let subtotal = baseWithNature + levelPts;
                const csMultipliers = {
                    '-6': 0.4, '-5': 0.5, '-4': 0.6, '-3': 0.7, '-2': 0.8, '-1': 0.9,
                    '0': 1, '1': 1.2, '2': 1.4, '3': 1.6, '4': 1.8, '5': 2, '6': 2.2
                };
                let multiplier = csMultipliers[cs] || 1;
                let total = Math.floor(subtotal * multiplier);

                row.querySelector('.stat-total').textContent = total;
            });
        }

        // Update multiplier button visual styles
        function updateMultiplierButtonStyles() {
            const multiplyBtn15 = document.getElementById('multiplyBtn15');

            if (!multiplyBtn15 || !multiplyBtn2) return;

            // Create modal HTML
            const modalHTML = `

                btn.addEventListener('click', function () {
                    const idx = selectedTypes.indexOf(type);
                    if (idx > -1) {
                        selectedTypes.splice(idx, 1);
                    } else {

                    // Update button styling and selected types display

            document.getElementById('closeTypesBtn').addEventListener('click', function () {

        // Update display name with nickname
        function updateDisplayName(pokemon) {

        // Update types display
        function updateTypesDisplay(pokemon) {
            const typesDisplay = document.getElementById('typesDisplay');
            const typesContainer = typesDisplay.parentElement;
            
            // Check if pokemon has forme variants
            if (pokemon.types && pokemon.types.isFormeVariant) {

                const selectedForme = pokemon.types.selectedForme;

        // Update remaining points display
        function updateRemainingPoints(pokemon) {
            const totalPoints = pokemon.level + 10;
            const shortNames = ['HP', 'atk', 'def', 'spA', 'spD', 'spe'];
            const baseStatsKeyMap = {
                'HP': 'HP',
                'atk': 'Attack',
                'def': 'Defense',
                'spA': 'Special Attack',
                'spD': 'Special Defense',
                'spe': 'Speed'
            };

            let distributedPoints = 0;

            // Calculate distributed points from the input fields, not from pokemon.stats
            shortNames.forEach(shortName => {
                const row = document.querySelector(`[data-stat="${shortName}"]`);
                if (row) {
                    const levelInput = row.querySelector('.level-points-input');
                    const levelPts = parseInt(levelInput?.value) || 0;
                    distributedPoints += levelPts;
                }
            });

            const remaining = totalPoints - distributedPoints;
            const display = document.getElementById('remainingPointsDisplay');
            if (display) {
                display.textContent = `Remaining: ${remaining}`;
                // Color it based on remaining points
                if (remaining === 0) {
                    display.style.background = '#d4edda';
                    display.style.borderColor = '#28a745';
                    display.style.color = '#28a745';
                } else if (remaining < 0) {
                    display.style.background = '#f8d7da';
                    display.style.borderColor = '#dc3545';
                    display.style.color = '#dc3545';
                } else {
                    display.style.background = '#f0f7ff';
                    display.style.borderColor = '#667eea';
                    display.style.color = '#667eea';
                }
            }
        }

        // Setup level editor
        function setupLevelEditor(pokemon) {
            const levelInput = document.getElementById('levelInput');
            if (!levelInput) return;

            levelInput.addEventListener('change', function () {
                const newLevel = parseInt(this.value);
                if (newLevel >= 1 && newLevel <= 100) {
                    pokemon.level = newLevel;
                    // Recalculate HP with new level (keeping same base and distribution)
                    const baseHP = pokemon.baseStats.HP;
                    const nature = pokemon.nature;
                    let hpStat = baseHP;
                    if (nature.raise === 'HP') hpStat += 1;
                    if (nature.lower === 'HP') hpStat -= 1;

                    pokemon.hitPoints = Math.max(1, Math.floor(newLevel + (pokemon.stats.HP * 3) + 10));

                    // Update HP display
                    const hpDisplay = document.getElementById('hpDisplay');
                    if (hpDisplay) hpDisplay.textContent = pokemon.hitPoints;

                    // Update header level
                    const headerLevel = document.getElementById('headerLevel');
                    if (headerLevel) headerLevel.textContent = `Level ${newLevel}`;

                    // Update page title
                    const pageTitle = `${pokemon.name} - Lvl ${newLevel} - Pokémon Details`;
                    document.getElementById('pageTitle').textContent = pageTitle;

                    // Update remaining points display
                    updateRemainingPoints(pokemon);
                } else {
                    this.value = pokemon.level;
                }
            });
        }

        // Setup stat distribution buttons
        function setupStatDistributionButtons(pokemon) {
            const randomBtn = document.getElementById('distributionRandomBtn');
            const balancedBtn = document.getElementById('distributionBalancedBtn');
            const minmaxedBtn = document.getElementById('distributionMinmaxedBtn');

            if (!randomBtn || !balancedBtn || !minmaxedBtn) return;

            randomBtn.addEventListener('click', function () {
                recalculateStatsWithDistribution(pokemon, 'RANDOM');
            });

            balancedBtn.addEventListener('click', function () {
                recalculateStatsWithDistribution(pokemon, 'BALANCED');
            });

            minmaxedBtn.addEventListener('click', function () {
                recalculateStatsWithDistribution(pokemon, 'MINMAXED');
            });
        }

        // Recalculate stats with a specific distribution
        function recalculateStatsWithDistribution(pokemon, distribution) {
            const totalPoints = pokemon.level + 10;
            const shortNames = ['HP', 'atk', 'def', 'spA', 'spD', 'spe'];
            const baseStatsKeyMap = {
                'HP': 'HP',
                'atk': 'Attack',
                'def': 'Defense',
                'spA': 'Special Attack',
                'spD': 'Special Defense',
                'spe': 'Speed'
            };

            // Get base stats without nature modifiers
            const baseStats = {};
            shortNames.forEach(shortName => {
                baseStats[shortName] = pokemon.baseStats[baseStatsKeyMap[shortName]] || 0;
            });

            // Calculate distribution of level points
            let distributedPoints = {};
            shortNames.forEach(s => distributedPoints[s] = 0);

            if (distribution === 'BALANCED') {
                // Equal distribution
                const pointsPerStat = Math.floor(totalPoints / shortNames.length);
                const remainder = totalPoints % shortNames.length;
                shortNames.forEach((s, index) => {
                    distributedPoints[s] = pointsPerStat + (index < remainder ? 1 : 0);
                });
            } else if (distribution === 'MINMAXED') {
                // More to high base stats, less to low
                const basesWithValues = shortNames.map(s => ({
                    stat: s,
                    base: baseStats[s]
                })).sort((a, b) => b.base - a.base);

                const totalWeight = shortNames.length * (shortNames.length + 1) / 2;
                basesWithValues.forEach((item, index) => {
                    const weight = shortNames.length - index;
                    const points = Math.round((weight / totalWeight) * totalPoints);
                    distributedPoints[item.stat] = points;
                });
            } else {
                // RANDOM - random distribution
                for (let i = 0; i < totalPoints; i++) {
                    const randomStat = shortNames[Math.floor(Math.random() * shortNames.length)];
                    distributedPoints[randomStat]++;
                }
            }

            // Apply nature modifiers and calculate final stats
            shortNames.forEach(shortName => {
                let baseValue = baseStats[shortName];
                let levelPoints = distributedPoints[shortName];

                // Apply nature modifier
                let natureModifier = 0;
                if (shortName === 'HP') {
                    if (pokemon.nature.raise === shortName) natureModifier = 1;
                    if (pokemon.nature.lower === shortName) natureModifier = -1;
                } else {
                    if (pokemon.nature.raise === shortName) natureModifier = 2;
                    if (pokemon.nature.lower === shortName) natureModifier = -2;
                }

                pokemon.stats[shortName] = Math.max(1, baseValue + levelPoints + natureModifier);
            });

            // Update display
            updateStatsDisplay(pokemon);
            updateRemainingPoints(pokemon);
        }

        // Update stats display after recalculation
        function updateStatsDisplay(pokemon) {
            const statsBreakdownContainer = document.getElementById('statsBreakdown');
            const statRows = statsBreakdownContainer.querySelectorAll('.stat-breakdown-row');
            const shortNames = ['HP', 'atk', 'def', 'spA', 'spD', 'spe'];
            const baseStatsKeyMap = {
                'HP': 'HP',
                'atk': 'Attack',
                'def': 'Defense',
                'spA': 'Special Attack',
                'spD': 'Special Defense',
                'spe': 'Speed'
            };

            statRows.forEach(row => {
                const statName = row.getAttribute('data-stat');
                const baseInput = row.querySelector('.base-stat-input');
                const levelInput = row.querySelector('.level-points-input');
                const csInput = row.querySelector('.cs-input');

                let baseStat = pokemon.baseStats[baseStatsKeyMap[statName]] || 0;
                let finalStat = pokemon.stats[statName];

                // Remove nature modifier to get level points
                let natureModifier = 0;
                if (statName === 'HP') {
                    if (pokemon.nature.raise === statName) natureModifier = 1;
                    if (pokemon.nature.lower === statName) natureModifier = -1;
                } else {
                    if (pokemon.nature.raise === statName) natureModifier = 2;
                    if (pokemon.nature.lower === statName) natureModifier = -2;
                }

                let levelPts = finalStat - baseStat - natureModifier;
                let cs = csInput ? parseInt(csInput.value) : 0;

                baseInput.value = baseStat;
                levelInput.value = Math.max(0, levelPts);

                // Recalculate total with nature and CS
                const csMultipliers = {
                    '-6': 0.4, '-5': 0.5, '-4': 0.6, '-3': 0.7, '-2': 0.8, '-1': 0.9,
                    '0': 1, '1': 1.2, '2': 1.4, '3': 1.6, '4': 1.8, '5': 2, '6': 2.2
                };
                let subtotal = baseStat + levelPts + natureModifier;
                let multiplier = csMultipliers[cs] || 1;
                let total = Math.floor(subtotal * multiplier);

                row.querySelector('.stat-total').textContent = total;
            });
        }

                        abilityCountSpan.textContent = (availableAbilities.basic?.length || 0) + (availableAbilities.advanced?.length || 0) + (availableAbilities.high?.length || 0);
                        searchInput.value = '';
                    }
                });

                // Search functionality
                searchInput.addEventListener('input', function () {
                    if (showingAllAbilities) {
                        filterAllAbilities(abilitiesGrid, this.value.toLowerCase(), allAbilitiesData);
                    } else {
                        filterAbilities(abilitiesGrid, this.value.toLowerCase(), availableAbilities);
                    }
                });

                // Display all abilities initially
                displayAbilitiesInGrid(abilitiesGrid, availableAbilities, pokemon);
            } catch (error) {
                console.error('Failed to load available abilities:', error);
                alert('Failed to load available abilities');
            }
        }

        // Get available abilities for a pokemon
        async function getAvailableAbilitiesForPokemon(pokemon) {
            try {
                const dataset = pokemon.dataset || 'core';
                const response = await fetch(`/api/pokemon/abilities/${encodeURIComponent(pokemon.name)}?dataset=${dataset}`);
                if (!response.ok) {
                    console.error('Failed to fetch abilities:', response.statusText);
                    return { basic: [], advanced: [], high: [] };
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching abilities:', error);
                return { basic: [], advanced: [], high: [] };
            }
        }

        // Get all abilities from database
        async function getAllAbilitiesFromDatabase() {
            try {
                const response = await fetch('/api/pokemon/all-abilities');
                if (!response.ok) {
                    console.error('Failed to fetch all abilities:', response.statusText);
                    return { all: [] };
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching all abilities:', error);
                return { all: [] };
            }
        }

        // Create modal HTML for adding an ability
        function createAddAbilityModalHTML(availableAbilities) {
            return `
                <div id="addAbilityModal" style="
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: rgba(0, 0, 0, 0.5);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 2000;
                ">
                    <div style="
                        background: white;
                        border-radius: 10px;
                        padding: 30px;
                        max-width: 800px;
                        width: 90%;
                        max-height: 80vh;
                        overflow-y: auto;
                        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
                    ">
                        <h2 style="margin-top: 0; color: #667eea; margin-bottom: 20px;">Edit</h2>
                        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
                            <input type="text" id="abilitySearchInput" placeholder="Search abilities..." style="
                                flex: 1;
                                padding: 10px;
                                border: 1px solid #ddd;
                                border-radius: 5px;
                                font-size: 0.95em;
                            " />
                            <button id="toggleAllAbilitiesBtn" style="
                                padding: 10px 15px;
                                background: #667eea;
                                color: white;
                                border: none;
                                border-radius: 5px;
                                cursor: pointer;
                                font-weight: 600;
                                font-size: 0.9em;
                                white-space: nowrap;
                            ">Show All Abilities</button>
                        </div>
                        <div style="margin-bottom: 20px; padding: 10px; background: #f0f7ff; border-radius: 5px; font-size: 0.9em; color: #666;">
                            <strong>Total abilities available:</strong> <span id="abilityCountSpan">${(availableAbilities.basic?.length || 0) + (availableAbilities.advanced?.length || 0) + (availableAbilities.high?.length || 0)}</span>
                        </div>
                        <div id="abilitiesGrid" style="
                            display: grid;
                            grid-template-columns: 1fr;
                            gap: 10px;
                            margin-bottom: 20px;
                            max-height: 400px;
                            overflow-y: auto;
                        "></div>
                        <div style="display: flex; gap: 10px;">
                            <button id="closeAddAbilityBtn" style="
                                flex: 1;
                                padding: 10px;
                                background: #f0f0f0;
                                color: #333;
                                border: none;
                                border-radius: 5px;
                                cursor: pointer;
                                font-weight: 600;
                            ">Close</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Display abilities in grid with categories
        function displayAbilitiesInGrid(grid, availableAbilities, pokemon) {
            grid.innerHTML = '';
            let hasAnyAbilities = false;

            // Basic Abilities
            if (availableAbilities.basic && availableAbilities.basic.length > 0) {
                hasAnyAbilities = true;
                const section = document.createElement('div');
                section.style.marginBottom = '15px';
                section.innerHTML = `<div style="font-weight: 600; color: #667eea; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #667eea;">⭐ Basic Abilities</div>`;
                
                const abilitiesList = document.createElement('div');
                abilitiesList.style.display = 'grid';
                abilitiesList.style.gap = '8px';
                
                availableAbilities.basic.forEach(ability => {
                    const btn = createAbilityButton(ability, pokemon, 'basic');
                    abilitiesList.appendChild(btn);
                });
                
                section.appendChild(abilitiesList);
                grid.appendChild(section);
            }

            // Advanced Abilities
            if (availableAbilities.advanced && availableAbilities.advanced.length > 0) {
                hasAnyAbilities = true;
                const section = document.createElement('div');
                section.style.marginBottom = '15px';
                section.innerHTML = `<div style="font-weight: 600; color: #667eea; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #667eea;">🔷 Advanced Abilities</div>`;
                
                const abilitiesList = document.createElement('div');
                abilitiesList.style.display = 'grid';
                abilitiesList.style.gap = '8px';
                
                availableAbilities.advanced.forEach(ability => {
                    const btn = createAbilityButton(ability, pokemon, 'advanced');
                    abilitiesList.appendChild(btn);
                });
                
                section.appendChild(abilitiesList);
                grid.appendChild(section);
            }

            // High Ability
            if (availableAbilities.high && availableAbilities.high.length > 0) {
                hasAnyAbilities = true;
                const section = document.createElement('div');
                section.style.marginBottom = '15px';
                section.innerHTML = `<div style="font-weight: 600; color: #667eea; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #667eea;">👑 High Ability</div>`;
                
                const abilitiesList = document.createElement('div');
                abilitiesList.style.display = 'grid';
                abilitiesList.style.gap = '8px';
                
                availableAbilities.high.forEach(ability => {
                    const btn = createAbilityButton(ability, pokemon, 'high');
                    abilitiesList.appendChild(btn);
                });
                
                section.appendChild(abilitiesList);
                grid.appendChild(section);
            }

            if (!hasAnyAbilities) {
                grid.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No abilities available for this Pokémon</div>';
            }
        }

        // Create an ability button
        function createAbilityButton(ability, pokemon, category) {
            const btn = document.createElement('button');
            
            // Check if ability already exists
            const abilityExists = pokemon.abilities.some(a => a.name === ability.name);
            
            btn.className = `modal-ability-btn ${abilityExists ? 'exists' : ''}`;

            const titleDiv = document.createElement('div');
            titleDiv.className = 'ability-btn-title';
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'ability-btn-name';
            nameSpan.textContent = ability.name;
            titleDiv.appendChild(nameSpan);
            
            if (abilityExists) {
                const checkmarkSpan = document.createElement('span');
                checkmarkSpan.className = 'ability-btn-checkmark';
                checkmarkSpan.textContent = ' ✓';
                titleDiv.appendChild(checkmarkSpan);
            }

            const detailsDiv = document.createElement('div');
            detailsDiv.className = 'ability-btn-details';
            detailsDiv.textContent = ability.frequency || 'N/A';

            btn.appendChild(titleDiv);
            btn.appendChild(detailsDiv);

            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                addAbility(pokemon, ability);
            });

            btn.dataset.abilityName = ability.name.toLowerCase();

            return btn;
        }

        // Filter abilities based on search
        function filterAbilities(grid, searchTerm, availableAbilities) {
            const buttons = grid.querySelectorAll('button[data-ability-name]');
            let visibleCount = 0;

            buttons.forEach(btn => {
                const matches = btn.dataset.abilityName.includes(searchTerm);
                btn.style.display = matches ? 'flex' : 'none';
                if (matches) visibleCount++;
            });

            if (visibleCount === 0) {
                if (!grid.querySelector('.no-results-abilities')) {
                    const noResults = document.createElement('div');
                    noResults.className = 'no-results-abilities';
                    noResults.style.cssText = 'padding: 20px; text-align: center; color: #999; grid-column: 1 / -1;';
                    noResults.textContent = 'No abilities match your search';
                    grid.appendChild(noResults);
                }
            } else {
                const noResults = grid.querySelector('.no-results-abilities');
                if (noResults) noResults.remove();
            }
        }

        // Display all abilities from database in grid
        function displayAllAbilitiesInGrid(grid, allAbilities, pokemon) {
            grid.innerHTML = '';
            
            if (!allAbilities.all || allAbilities.all.length === 0) {
                grid.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No abilities available in database</div>';
                return;
            }

            const section = document.createElement('div');
            section.style.marginBottom = '15px';
            section.innerHTML = `<div style="font-weight: 600; color: #667eea; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #667eea;">📚 All Abilities</div>`;
            
            const abilitiesList = document.createElement('div');
            abilitiesList.style.display = 'grid';
            abilitiesList.style.gap = '8px';
            
            allAbilities.all.forEach(ability => {
                const btn = createAbilityButton(ability, pokemon, 'all');
                abilitiesList.appendChild(btn);
            });
            
            section.appendChild(abilitiesList);
            grid.appendChild(section);
        }

        // Filter all abilities based on search
        function filterAllAbilities(grid, searchTerm, allAbilities) {
            let visibleCount = 0;

            grid.querySelectorAll('button[data-ability-name]').forEach(btn => {
                const matches = btn.dataset.abilityName.includes(searchTerm);
                btn.style.display = matches ? 'flex' : 'none';
                if (matches) visibleCount++;
            });

            if (visibleCount === 0) {
                if (!grid.querySelector('.no-results-abilities')) {
                    const noResults = document.createElement('div');
                    noResults.className = 'no-results-abilities';
                    noResults.style.cssText = 'padding: 20px; text-align: center; color: #999; grid-column: 1 / -1;';
                    noResults.textContent = 'No abilities match your search';
                    grid.appendChild(noResults);
                }
            } else {
                const noResults = grid.querySelector('.no-results-abilities');
                if (noResults) noResults.remove();
            }
        }

        // Export function
        function exportPokemon(pokemon) {
            const dataStr = JSON.stringify(pokemon, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            const filename = pokemon.nickname 
                ? `${pokemon.nickname}_${pokemon.name}_Lvl${pokemon.level}.json`
                : `${pokemon.name}_Lvl${pokemon.level}.json`;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Load on page load
        window.addEventListener('load', function () {
            loadPokemonDetails();
        });
    </script>
</body>
