        // Type effectiveness chart - structured as [defendingType][attackingType]

        const typeEffectiveness = {"normal": {"bug": 1, "dark": 1, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 2, "fire": 1, "flying": 1, "ghost": 0, "grass": 1, "ground": 1, "ice": 1, "normal": 1, "poison": 1, "psychic": 1, "rock": 1, "steel": 1, "water": 1}, "fire": {"bug": 0.5, "dark": 1, "dragon": 1, "electric": 1, "fairy": 0.5, "fighting": 1, "fire": 0.5, "flying": 1, "ghost": 1, "grass": 0.5, "ground": 2, "ice": 0.5, "normal": 1, "poison": 1, "psychic": 1, "rock": 2, "steel": 0.5, "water": 2}, "water": {"bug": 1, "dark": 1, "dragon": 1, "electric": 2, "fairy": 1, "fighting": 1, "fire": 0.5, "flying": 1, "ghost": 1, "grass": 2, "ground": 1, "ice": 0.5, "normal": 1, "poison": 1, "psychic": 1, "rock": 1, "steel": 0.5, "water": 0.5}, "grass": {"bug": 2, "dark": 1, "dragon": 1, "electric": 0.5, "fairy": 1, "fighting": 1, "fire": 2, "flying": 2, "ghost": 1, "grass": 0.5, "ground": 0.5, "ice": 2, "normal": 1, "poison": 2, "psychic": 1, "rock": 1, "steel": 1, "water": 0.5}, "flying": {"bug": 0.5, "dark": 1, "dragon": 1, "electric": 2, "fairy": 1, "fighting": 0.5, "fire": 1, "flying": 1, "ghost": 1, "grass": 0.5, "ground": 0, "ice": 2, "normal": 1, "poison": 1, "psychic": 1, "rock": 2, "steel": 1, "water": 1}, "fighting": {"bug": 0.5, "dark": 0.5, "dragon": 1, "electric": 1, "fairy": 2, "fighting": 1, "fire": 1, "flying": 2, "ghost": 1, "grass": 1, "ground": 1, "ice": 1, "normal": 1, "poison": 1, "psychic": 2, "rock": 0.5, "steel": 1, "water": 1}, "poison": {"bug": 0.5, "dark": 1, "dragon": 1, "electric": 1, "fairy": 0.5, "fighting": 0.5, "fire": 1, "flying": 1, "ghost": 1, "grass": 0.5, "ground": 2, "ice": 1, "normal": 1, "poison": 0.5, "psychic": 2, "rock": 1, "steel": 1, "water": 1}, "ground": {"bug": 1, "dark": 1, "dragon": 1, "electric": 0, "fairy": 1, "fighting": 1, "fire": 1, "flying": 1, "ghost": 1, "grass": 2, "ground": 1, "ice": 2, "normal": 1, "poison": 0.5, "psychic": 1, "rock": 0.5, "steel": 1, "water": 2}, "rock": {"bug": 1, "dark": 1, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 2, "fire": 0.5, "flying": 0.5, "ghost": 1, "grass": 2, "ground": 2, "ice": 1, "normal": 0.5, "poison": 0.5, "psychic": 1, "rock": 1, "steel": 2, "water": 2}, "psychic": {"bug": 2, "dark": 2, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 0.5, "fire": 1, "flying": 1, "ghost": 2, "grass": 1, "ground": 1, "ice": 1, "normal": 1, "poison": 1, "psychic": 0.5, "rock": 1, "steel": 1, "water": 1}, "ice": {"bug": 1, "dark": 1, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 2, "fire": 2, "flying": 1, "ghost": 1, "grass": 1, "ground": 1, "ice": 0.5, "normal": 1, "poison": 1, "psychic": 1, "rock": 2, "steel": 2, "water": 1}, "bug": {"bug": 1, "dark": 1, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 0.5, "fire": 2, "flying": 2, "ghost": 1, "grass": 0.5, "ground": 0.5, "ice": 1, "normal": 1, "poison": 1, "psychic": 1, "rock": 2, "steel": 0.5, "water": 1}, "ghost": {"bug": 0.5, "dark": 2, "dragon": 1, "electric": 1, "fairy": 1, "fighting": 0, "fire": 1, "flying": 1, "ghost": 2, "grass": 1, "ground": 1, "ice": 1, "normal": 0, "poison": 0.5, "psychic": 1, "rock": 1, "steel": 1, "water": 1}, "steel": {"bug": 0.5, "dark": 1, "dragon": 0.5, "electric": 1, "fairy": 0.5, "fighting": 2, "fire": 2, "flying": 0.5, "ghost": 1, "grass": 0.5, "ground": 2, "ice": 0.5, "normal": 0.5, "poison": 0, "psychic": 0.5, "rock": 0.5, "steel": 0.5, "water": 1}, "dragon": {"bug": 1, "dark": 1, "dragon": 2, "electric": 0.5, "fairy": 2, "fighting": 1, "fire": 0.5, "flying": 1, "ghost": 1, "grass": 0.5, "ground": 1, "ice": 2, "normal": 1, "poison": 1, "psychic": 1, "rock": 1, "steel": 1, "water": 0.5}, "dark": {"bug": 2, "dark": 0.5, "dragon": 1, "electric": 1, "fairy": 2, "fighting": 2, "fire": 1, "flying": 1, "ghost": 0.5, "grass": 1, "ground": 1, "ice": 1, "normal": 1, "poison": 1, "psychic": 0, "rock": 1, "steel": 1, "water": 1}, "fairy": {"bug": 0.5, "dark": 0.5, "dragon": 0, "electric": 1, "fairy": 1, "fighting": 0.5, "fire": 1, "flying": 1, "ghost": 1, "grass": 1, "ground": 1, "ice": 1, "normal": 1, "poison": 2, "psychic": 1, "rock": 1, "steel": 2, "water": 1}, "electric": {"bug": 1, "dark": 1, "dragon": 1, "electric": 0.5, "fairy": 1, "fighting": 1, "fire": 1, "flying": 0.5, "ghost": 1, "grass": 1, "ground": 2, "ice": 1, "normal": 1, "poison": 1, "psychic": 1, "rock": 1, "steel": 0.5, "water": 1}};


        function calculateTypeEffectiveness(types) {
            const effectiveness = {};
            const allTypes = ['normal', 'fire', 'water', 'electric', 'grass', 'ice', 'fighting', 'poison', 'ground', 'flying', 'psychic', 'bug', 'rock', 'ghost', 'dragon', 'dark', 'steel', 'fairy'];

            // Initialize all attacking types with 1x effectiveness
            allTypes.forEach(attackingType => {
                effectiveness[attackingType] = 1;
            });

            // For each attacking type, multiply effectiveness against each defending type
            allTypes.forEach(attackingType => {
                types.forEach(defendingType => {
                    const defendingTypeLower = defendingType.toLowerCase();
                    const defendingTypeData = typeEffectiveness[defendingTypeLower];
                    
                    if (!defendingTypeData) {
                        console.warn(`No type data for defending type: ${defendingTypeLower}`);
                        return;
                    }
                    
                    const eff = defendingTypeData[attackingType];
                    
                    if (eff === undefined) {
                        console.warn(`No effectiveness data for ${attackingType} vs ${defendingTypeLower}`);
                        return;
                    }
                    
                    effectiveness[attackingType] = effectiveness[attackingType] * eff;
                });
            });

            return effectiveness;
        }

        function displayTypeEffectiveness(pokemon) {
            // Get the actual types to use
            let typesToUse = pokemon.actualTypes || pokemon.types || [];
            
            // If types is a forme variant object, extract the actual types
            if (typesToUse.isFormeVariant) {
                const selectedForme = typesToUse.selectedForme;
                typesToUse = typesToUse.formes[selectedForme] || [];
            }

            const effectiveness = calculateTypeEffectiveness(typesToUse);
            const container = document.getElementById('typeEffectiveness');

            if (!container) return;

            container.innerHTML = '';

            const allTypes = ['Normal', 'Fire', 'Water', 'Electric', 'Grass', 'Ice', 'Fighting', 'Poison', 'Ground', 'Flying', 'Psychic', 'Bug', 'Rock', 'Ghost', 'Dragon', 'Dark', 'Steel', 'Fairy'];
            const midpoint = Math.ceil(allTypes.length / 2);
            const firstHalf = allTypes.slice(0, midpoint);
            const secondHalf = allTypes.slice(midpoint);

            // Create function to render a table half
            const renderHalf = (types) => {
                let html = `
                    <table class="details-table">
                        <tbody>
                            <tr class="details-table-header-row">
                `;

                // First row: Type badges
                types.forEach(type => {
                    html += `
                        <td class="details-table-type-cell">
                            <span class="type-badge type-badge-table type-${type.toLowerCase().replace(' ', '-')}">${type}</span>
                        </td>
                    `;
                });

                html += `
                            </tr>
                            <tr class="details-table-body-row">
                `;

                // Second row: Effectiveness values
                types.forEach(type => {
                    let eff = effectiveness[type.toLowerCase()];
                    
                    // Apply multiplier logic:
                    // Mode x2: multiplicateurs normaux (x2, x4, etc)
                    // Mode x1.5: système additif - chaque faiblesse ajoute 0.5 à la valeur de base (1)
                    // - Une seule faiblesse (x2) → 1 + 0.5 = 1.5
                    // - Double faiblesse (x4) → 1 + 0.5 + 0.5 = 2
                    // - Résistances inchangées (x0.5, x0.25)
                    if (currentTypeMultiplier === 1.5 && eff > 1) {
                        // Compter le nombre de faiblesses (combien de fois on multiplie par 2)
                        let weakness_count = 0;
                        let temp = eff;
                        while (temp > 1) {
                            weakness_count++;
                            temp = temp / 2;
                        }
                        // En mode x1.5, chaque faiblesse = +0.5
                        eff = 1 + (0.5 * weakness_count);
                    }
                    // Résistances et neutral restent inchangés
                    
                    let effClass = 'eff-neutral'; // Default
                    let effText = '1x';
                    
                    // Format effectiveness with minimal decimals
                    const formatEff = (value) => {
                        if (value === 0) return '0x';
                        if (value === 1) return '1x';
                        if (Number.isInteger(value)) return value + 'x';
                        // Show minimal decimals (remove trailing zeros)
                        return parseFloat(value.toFixed(2)).toString() + 'x';
                    };

                    if (eff === 0) {
                        effClass = 'eff-immune';
                        effText = '0x';
                    } else if (eff <= 0.25) {
                        effClass = 'eff-strong-resist';
                        effText = formatEff(eff);
                    } else if (eff <= 0.5) {
                        effClass = 'eff-resist';
                        effText = formatEff(eff);
                    } else if (eff === 1) {
                        effClass = 'eff-neutral';
                        effText = '1x';
                    } else if (eff <= 2) {
                        effClass = 'eff-weak';
                        effText = formatEff(eff);
                    } else {
                        effClass = 'eff-strong-weak';
                        effText = formatEff(eff);
                    }

                    html += `
                        <td class="type-eff-value-cell ${effClass}">
                            ${effText}
                        </td>
                    `;
                });

                html += `
                            </tr>
                        </tbody>
                    </table>
                `;

                return html;
            };

            container.innerHTML = renderHalf(firstHalf) + renderHalf(secondHalf);
        }

        function loadPokemonDetails() {

            // Ensure capabilities is an array
            if (!pokemon.capabilities) {
                pokemon.capabilities = [];
            }

            // Ensure hpFormula is present if exists in original object (from API or localStorage)
            if (!pokemon.hpFormula && pokemon.hp_formula) {
                pokemon.hpFormula = pokemon.hp_formula;
            }

            // Debug: log the pokemon object structure
            console.log('Pokemon object:', pokemon);

            // Update page title and favicon
            const pageTitle = `${pokemon.name} - Lvl ${pokemon.level} - Pokémon Details`;
            document.getElementById('pageTitle').textContent = pageTitle;
            const iconNumber = pokemon.Icon || pokemon.id;
            
            // Load and crop favicon to remove transparency padding
            const faviconUrl = `https://sewef.github.io/ptu/img/pokemon/icons/${iconNumber}.png`;
            const faviconImg = new Image();
            faviconImg.crossOrigin = 'anonymous';
            faviconImg.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = faviconImg.width;
                    canvas.height = faviconImg.height;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.drawImage(faviconImg, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    // Find bounds of non-transparent pixels
                    let minX = canvas.width, maxX = 0;
                    let minY = canvas.height, maxY = 0;
                    
                    for (let i = 3; i < data.length; i += 4) {
                        const alpha = data[i];
                        if (alpha > 128) {
                            const pixelIndex = (i - 3) / 4;
                            const x = pixelIndex % canvas.width;
                            const y = Math.floor(pixelIndex / canvas.width);
                            
                            minX = Math.min(minX, x);
                            maxX = Math.max(maxX, x);
                            minY = Math.min(minY, y);
                            maxY = Math.max(maxY, y);
                        }
                    }
                    
                    // Add padding around subject
                    const padding = 4;
                    const cropX = Math.max(0, minX - padding);
                    const cropY = Math.max(0, minY - padding);
                    const cropWidth = Math.min(canvas.width - cropX, maxX - minX + 2 * padding + 1);
                    const cropHeight = Math.min(canvas.height - cropY, maxY - minY + 2 * padding + 1);
                    
                    // Create cropped image
                    const croppedCanvas = document.createElement('canvas');
                    croppedCanvas.width = cropWidth;
                    croppedCanvas.height = cropHeight;
                    const croppedCtx = croppedCanvas.getContext('2d');
                    
                    croppedCtx.drawImage(canvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
                    
                    // Set as favicon
                    const dataUrl = croppedCanvas.toDataURL('image/png');
                    document.getElementById('dynamicFavicon').href = dataUrl;
                } catch (e) {
                    // Fallback if cropping fails
                    document.getElementById('dynamicFavicon').href = faviconUrl;
                }
            };
            faviconImg.onerror = function() {
                document.getElementById('dynamicFavicon').href = faviconUrl;
            };
            faviconImg.src = faviconUrl;

            // Get the actual types for styling
            let typesToUse = pokemon.actualTypes || pokemon.types || ['Normal'];
            if (typesToUse.isFormeVariant) {
                typesToUse = typesToUse.formes[typesToUse.selectedForme] || ['Normal'];

        // Load available natures and setup dropdown
        async function setupNatureDropdown(pokemon) {
            try {
                const response = await fetch('/api/pokemon/natures');
                if (response.ok) {
                    const data = await response.json();
                    const natureSelect = document.getElementById('natureSelect');

                    // Clear existing options
                    natureSelect.innerHTML = '';

                    // Add options for each nature
                    data.natures.forEach(nature => {
                        const option = document.createElement('option');
                        option.value = nature.name;
                        option.textContent = `${nature.name} (+${nature.raise} -${nature.lower})`;
                        if (nature.name === pokemon.nature.name) {
                            option.selected = true;
                        }
                        natureSelect.appendChild(option);
                    });

                    // Add event listener for nature changes
                    natureSelect.addEventListener('change', function () {
                        const selectedNature = data.natures.find(n => n.name === this.value);
                        if (selectedNature) {
                            // Update nature display
                            document.getElementById('natureRaise').textContent = `+${selectedNature.raise}`;
                            document.getElementById('natureLower').textContent = `-${selectedNature.lower}`;

                            // Update pokemon object
                            pokemon.nature = selectedNature;

                            // Recalculate and update stats with new nature
                            updateStatsWithNature(selectedNature);
                        }
                    });
                }
            } catch (error) {
                console.error('Failed to load natures:', error);
            }
        }

        // Recalculate stats when nature changes
        function updateStatsWithNature(newNature) {
            const statsBreakdownContainer = document.getElementById('statsBreakdown');
            const statRows = statsBreakdownContainer.querySelectorAll('.stat-breakdown-row');

            const statNames = ['HP', 'atk', 'def', 'spA', 'spD', 'spe'];
            const statDisplayNames = {
                'HP': 'HP',
                'atk': 'Attack',
                'def': 'Defense',
                'spA': 'Special Attack',
                'spD': 'Special Defense',
                'spe': 'Speed'
            };

            statRows.forEach(row => {
                const statName = row.getAttribute('data-stat');
                const baseInput = row.querySelector('.base-stat-input');
                const levelInput = row.querySelector('.level-points-input');
                const csInput = row.querySelector('.cs-input');

                let base = parseInt(baseInput?.value) || 0;
                let levelPts = parseInt(levelInput?.value) || 0;
                let cs = parseInt(csInput?.value) || 0;

                // Apply nature modifier to base stat (for display purposes)
                let baseWithNature = base;
                if (statName === 'HP') {
                    if (newNature.raise === statName) baseWithNature += 1;
                    if (newNature.lower === statName) baseWithNature -= 1;
                } else {
                    if (newNature.raise === statName) baseWithNature += 2;
                    if (newNature.lower === statName) baseWithNature -= 2;
                }

                // Calculate total with nature applied
                let subtotal = baseWithNature + levelPts;
                const csMultipliers = {
                    '-6': 0.4, '-5': 0.5, '-4': 0.6, '-3': 0.7, '-2': 0.8, '-1': 0.9,
                    '0': 1, '1': 1.2, '2': 1.4, '3': 1.6, '4': 1.8, '5': 2, '6': 2.2
                };
                let multiplier = csMultipliers[cs] || 1;
                let total = Math.floor(subtotal * multiplier);

                row.querySelector('.stat-total').textContent = total;
            });
        }

            const multiplyBtn15 = document.getElementById('multiplyBtn15');

            if (!multiplyBtn15 || !multiplyBtn2) return;

        // Recalculate stats with a specific distribution
        function recalculateStatsWithDistribution(pokemon, distribution) {
            const totalPoints = pokemon.level + 10;
            const shortNames = ['HP', 'atk', 'def', 'spA', 'spD', 'spe'];
            const baseStatsKeyMap = {
                'HP': 'HP',
                'atk': 'Attack',
                'def': 'Defense',
                'spA': 'Special Attack',
                'spD': 'Special Defense',
                'spe': 'Speed'
            };

            // Get base stats without nature modifiers
            const baseStats = {};
            shortNames.forEach(shortName => {
                baseStats[shortName] = pokemon.baseStats[baseStatsKeyMap[shortName]] || 0;
            });

            // Calculate distribution of level points
            let distributedPoints = {};
            shortNames.forEach(s => distributedPoints[s] = 0);

            if (distribution === 'BALANCED') {
                // Equal distribution
                const pointsPerStat = Math.floor(totalPoints / shortNames.length);
                const remainder = totalPoints % shortNames.length;
                shortNames.forEach((s, index) => {
                    distributedPoints[s] = pointsPerStat + (index < remainder ? 1 : 0);
                });
            } else if (distribution === 'MINMAXED') {
                // More to high base stats, less to low
                const basesWithValues = shortNames.map(s => ({
                    stat: s,
                    base: baseStats[s]
                })).sort((a, b) => b.base - a.base);

                const totalWeight = shortNames.length * (shortNames.length + 1) / 2;
                basesWithValues.forEach((item, index) => {
                    const weight = shortNames.length - index;
                    const points = Math.round((weight / totalWeight) * totalPoints);
                    distributedPoints[item.stat] = points;
                });
            } else {
                // RANDOM - random distribution
                for (let i = 0; i < totalPoints; i++) {
                    const randomStat = shortNames[Math.floor(Math.random() * shortNames.length)];
                    distributedPoints[randomStat]++;
                }
            }

            // Apply nature modifiers and calculate final stats
            shortNames.forEach(shortName => {
                let baseValue = baseStats[shortName];
                let levelPoints = distributedPoints[shortName];

                // Apply nature modifier
                let natureModifier = 0;
                if (shortName === 'HP') {
                    if (pokemon.nature.raise === shortName) natureModifier = 1;
                    if (pokemon.nature.lower === shortName) natureModifier = -1;
                } else {
                    if (pokemon.nature.raise === shortName) natureModifier = 2;
                    if (pokemon.nature.lower === shortName) natureModifier = -2;
                }

                pokemon.stats[shortName] = Math.max(1, baseValue + levelPoints + natureModifier);
            });

            // Update display
            updateStatsDisplay(pokemon);
            updateRemainingPoints(pokemon);
        }

        // Update stats display after recalculation
        function updateStatsDisplay(pokemon) {
            const statsBreakdownContainer = document.getElementById('statsBreakdown');
            const statRows = statsBreakdownContainer.querySelectorAll('.stat-breakdown-row');
            const shortNames = ['HP', 'atk', 'def', 'spA', 'spD', 'spe'];
            const baseStatsKeyMap = {
                'HP': 'HP',
                'atk': 'Attack',
                'def': 'Defense',
                'spA': 'Special Attack',
                'spD': 'Special Defense',
                'spe': 'Speed'
            };

            statRows.forEach(row => {
                const statName = row.getAttribute('data-stat');
                const baseInput = row.querySelector('.base-stat-input');
                const levelInput = row.querySelector('.level-points-input');
                const csInput = row.querySelector('.cs-input');

                let baseStat = pokemon.baseStats[baseStatsKeyMap[statName]] || 0;
                let finalStat = pokemon.stats[statName];

                // Remove nature modifier to get level points
                let natureModifier = 0;
                if (statName === 'HP') {
                    if (pokemon.nature.raise === statName) natureModifier = 1;
                    if (pokemon.nature.lower === statName) natureModifier = -1;
                } else {
                    if (pokemon.nature.raise === statName) natureModifier = 2;
                    if (pokemon.nature.lower === statName) natureModifier = -2;
                }

                let levelPts = finalStat - baseStat - natureModifier;
                let cs = csInput ? parseInt(csInput.value) : 0;

                baseInput.value = baseStat;
                levelInput.value = Math.max(0, levelPts);

                // Recalculate total with nature and CS
                const csMultipliers = {
                    '-6': 0.4, '-5': 0.5, '-4': 0.6, '-3': 0.7, '-2': 0.8, '-1': 0.9,
                    '0': 1, '1': 1.2, '2': 1.4, '3': 1.6, '4': 1.8, '5': 2, '6': 2.2
                };
                let subtotal = baseStat + levelPts + natureModifier;
                let multiplier = csMultipliers[cs] || 1;
                let total = Math.floor(subtotal * multiplier);

                row.querySelector('.stat-total').textContent = total;
            });
        }

        // Adjust Damage Base for a move
        function adjustMoveDB(pokemon, moveName, delta) {
            const move = pokemon.moves.find(m => m.name === moveName);
            if (!move || !move.damageBase) return;

            // Damage Base conversion table
            const DAMAGE_BASE_TABLE = {
                1: { dmg: '1d6+1', min: 2, avg: 5, max: 7 },
                2: { dmg: '1d6+3', min: 4, avg: 7, max: 9 },
                3: { dmg: '1d6+5', min: 6, avg: 9, max: 11 },
                4: { dmg: '1d8+6', min: 7, avg: 11, max: 14 },
                5: { dmg: '1d8+8', min: 9, avg: 13, max: 16 },
                6: { dmg: '2d6+8', min: 10, avg: 15, max: 20 },
                7: { dmg: '2d6+10', min: 12, avg: 17, max: 22 },
                8: { dmg: '2d8+10', min: 12, avg: 19, max: 26 },
                9: { dmg: '2d10+10', min: 12, avg: 21, max: 30 },
                10: { dmg: '3d8+10', min: 13, avg: 24, max: 34 },
                11: { dmg: '3d10+10', min: 13, avg: 27, max: 40 },
                12: { dmg: '3d12+10', min: 13, avg: 30, max: 46 },
                13: { dmg: '4d10+10', min: 14, avg: 35, max: 50 },
                14: { dmg: '4d10+15', min: 19, avg: 40, max: 55 },
                15: { dmg: '4d10+20', min: 24, avg: 45, max: 60 },
                16: { dmg: '5d10+20', min: 25, avg: 50, max: 70 },
                17: { dmg: '5d12+25', min: 30, avg: 60, max: 85 },
                18: { dmg: '6d12+25', min: 31, avg: 65, max: 97 },
                19: { dmg: '6d12+30', min: 36, avg: 70, max: 102 },
                20: { dmg: '6d12+35', min: 41, avg: 75, max: 107 },
                21: { dmg: '6d12+40', min: 46, avg: 80, max: 112 },
                22: { dmg: '6d12+45', min: 51, avg: 85, max: 117 },
                23: { dmg: '6d12+50', min: 56, avg: 90, max: 122 },
                24: { dmg: '6d12+55', min: 61, avg: 95, max: 127 },
                25: { dmg: '6d12+60', min: 66, avg: 100, max: 132 },
                26: { dmg: '7d12+65', min: 72, avg: 110, max: 149 },
                27: { dmg: '8d12+70', min: 78, avg: 120, max: 166 },
                28: { dmg: '8d12+80', min: 88, avg: 130, max: 176 }
            };

            // Get current DB - it's stored as 'DB11', 'DB12', etc.
            let currentDB = move.damageBase.short;
            if (typeof currentDB === 'string') {
                // Extract the number from 'DB11' format
                currentDB = parseInt(currentDB.replace('DB', ''));
            }
            if (typeof currentDB !== 'number' || isNaN(currentDB)) {
                console.error('Invalid DB value:', move.damageBase);
                return;
            }

            let newDB = currentDB + delta;
            
            // Clamp to valid range
            newDB = Math.max(1, Math.min(28, newDB));

            if (newDB === currentDB) return; // No change

            // Update the damage base
            const newDamageData = DAMAGE_BASE_TABLE[newDB];
            if (!newDamageData) {
                console.error('No damage data for DB:', newDB);
                return;
            }

            move.damageBase.short = 'DB' + newDB;
            move.damageBase.dmg = newDamageData.dmg;
            move.damageBase.min = newDamageData.min;
            move.damageBase.avg = newDamageData.avg;
            move.damageBase.max = newDamageData.max;

            updateMovesDisplay(pokemon);
        }

        // Toggle move usage tracking
        function toggleMoveUsage(pokemon, moveName, usageIndex) {
            const move = pokemon.moves.find(m => m.name === moveName);
            if (!move) return;

            // Initialize usageCount if not present
            if (!move.usageCount) {
                move.usageCount = 0;
            }

            // Toggle the usage at this index
            if (move.usageCount > usageIndex) {
                // If we're toggling off a previous usage, set count to this index
                move.usageCount = usageIndex;
            } else if (move.usageCount === usageIndex) {
                // If toggling on the next one, increment
                move.usageCount = usageIndex + 1;
            } else {
                // Fill in gaps - if clicking further ahead, set to that index + 1
                move.usageCount = usageIndex + 1;
            }

            updateMovesDisplay(pokemon);
        }

        // Show modal to add a move
        async function showAddMoveModal(pokemon) {
            try {
                // Get available moves for this pokemon

        // Generic filter function for items in grid
        function filterGridItems(grid, searchTerm, itemSelector, matchFn, noResultsClass, noResultsText) {
            let visibleCount = 0;

            // Filter buttons and track visibility
            grid.querySelectorAll(itemSelector).forEach(btn => {
                btn.classList.remove('btn-hidden');
                if (!matchFn(btn)) {
                    btn.classList.add('btn-hidden');
                } else {
                    visibleCount++;
                }
            });

            // Show/hide sections based on visible buttons
            const sections = Array.from(grid.children).filter(child => 
                child.style.marginBottom === '15px' && 
                child.querySelectorAll(itemSelector).length > 0
            );
            
            sections.forEach(section => {
                const hasVisibleButtons = Array.from(section.querySelectorAll(itemSelector))
                    .some(btn => !btn.classList.contains('btn-hidden'));
                
                section.style.display = hasVisibleButtons ? 'block' : 'none';
                const listDiv = section.children[1];
                if (listDiv && listDiv.tagName === 'DIV') {
                    listDiv.style.display = hasVisibleButtons ? 'grid' : 'none';
                }
            });

            // Show/hide no results message
            if (visibleCount === 0) {
                if (!grid.querySelector('.' + noResultsClass)) {
                    const noResults = document.createElement('div');
                    noResults.className = noResultsClass;
                    noResults.style.cssText = 'padding: 20px; text-align: center; color: #999; grid-column: 1 / -1;';
                    noResults.textContent = noResultsText;
                    grid.appendChild(noResults);
                }
            } else {
                const noResults = grid.querySelector('.' + noResultsClass);
                if (noResults) noResults.remove();
            }
        }

        // Toggle ability usage tracking

            const ability = pokemon.abilities.find(a => a.name === abilityName);
            if (!ability) return;

            // Initialize usageCount if not present
            if (!ability.usageCount) {
                ability.usageCount = 0;
            }

            // Toggle the usage at this index
            if (ability.usageCount > usageIndex) {
                ability.usageCount = usageIndex;
            } else if (ability.usageCount === usageIndex) {
                ability.usageCount = usageIndex + 1;
            } else {
                ability.usageCount = usageIndex + 1;
            }

            updateAbilitiesDisplay(pokemon);
        }

            const abilitiesList = document.createElement('div');
            abilitiesList.style.display = 'grid';
            abilitiesList.style.gap = '8px';
            
            allAbilities.all.forEach(ability => {
                const btn = createAbilityButton(ability, pokemon, 'all');
                abilitiesList.appendChild(btn);
            });
            
            section.appendChild(abilitiesList);
            grid.appendChild(section);
        }

        // Filter all abilities based on search
        function filterAllAbilities(grid, searchTerm, allAbilities) {
            filterGridItems(grid, searchTerm, 'button[data-ability-name]',
                btn => btn.dataset.abilityName.includes(searchTerm),
                'no-results-abilities', 'No abilities match your search');
        }

        // Load on page load
        window.addEventListener('load', function () {
            loadPokemonDetails();
        });
    </script>
</body>

</html>
