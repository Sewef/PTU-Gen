<!DOCTYPE html>
<html>
<head>
    <title>Test Abilities Feature</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .success { background: #d4edda; border-color: #28a745; }
        .error { background: #f8d7da; border-color: #dc3545; }
    </style>
</head>
<body>
    <h1>Test Abilities Feature</h1>
    
    <div id="results"></div>
    
    <script>
        async function runTests() {
            const results = document.getElementById('results');
            
            // Test 1: Generate Pokemon
            try {
                const pokemonRes = await fetch('/api/pokemon/generate?species=pikachu&level=50');
                const pokemon = await pokemonRes.json();
                results.innerHTML += `<div class="test-result success">✓ Generated Pokemon: ${pokemon.name} (Level ${pokemon.level})</div>`;
                
                // Test 2: Fetch abilities for the Pokemon
                const abilitiesRes = await fetch(`/api/pokemon/abilities/${pokemon.name}`);
                const abilities = await abilitiesRes.json();
                
                const totalAbilities = (abilities.basic?.length || 0) + (abilities.advanced?.length || 0) + (abilities.high?.length || 0);
                results.innerHTML += `<div class="test-result success">✓ Fetched abilities: ${abilities.basic?.length || 0} basic, ${abilities.advanced?.length || 0} advanced, ${abilities.high?.length || 0} high (Total: ${totalAbilities})</div>`;
                
                // Test 3: Check ability structure
                if (abilities.basic && abilities.basic.length > 0) {
                    const firstAbility = abilities.basic[0];
                    if (firstAbility.name && firstAbility.frequency) {
                        results.innerHTML += `<div class="test-result success">✓ Ability structure correct: ${firstAbility.name} (${firstAbility.frequency})</div>`;
                    } else {
                        results.innerHTML += `<div class="test-result error">✗ Ability structure incorrect: ${JSON.stringify(firstAbility)}</div>`;
                    }
                }

                // Test 4: Test with different Pokemon (Charizard)
                const charizardRes = await fetch('/api/pokemon/generate?species=charizard&level=50');
                const charizard = await charizardRes.json();
                
                const charizardAbilitiesRes = await fetch(`/api/pokemon/abilities/${charizard.name}`);
                const charizardAbilities = await charizardAbilitiesRes.json();
                
                results.innerHTML += `<div class="test-result success">✓ Charizard abilities: ${charizardAbilities.basic?.length || 0} basic, ${charizardAbilities.advanced?.length || 0} advanced, ${charizardAbilities.high?.length || 0} high</div>`;
                
            } catch (err) {
                results.innerHTML += `<div class="test-result error">✗ Test failed: ${err.message}</div>`;
            }
        }
        
        window.onload = runTests;
    </script>
</body>
</html>
