<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autocomplete Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .test-container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group-autocomplete {
            position: relative;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .autocomplete-suggestions {
            position: absolute;
            top: calc(100% + 3px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 0 0 5px 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .autocomplete-suggestions.open {
            display: block;
            border-top: 1px solid #ddd;
        }

        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover,
        .autocomplete-item.selected {
            background-color: #e8e8ff;
            color: #667eea;
        }

        .info {
            background: #e8f4f8;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Autocomplete Test</h1>
        
        <div class="form-group-autocomplete">
            <label>Species (Pokémon)</label>
            <input type="text" id="species" placeholder="Type 'pika', 'char', etc...">
            <div class="autocomplete-suggestions" id="speciesSuggestions"></div>
        </div>

        <div class="info">
            <strong>Status:</strong> <span id="status">Loading...</span><br>
            <strong>Loaded:</strong> <span id="count">0</span> Pokémon
        </div>
    </div>

    <script>
        let allPokemon = [];
        let selectedSuggestionIndex = -1;

        const speciesInput = document.getElementById('species');
        const suggestionsList = document.getElementById('speciesSuggestions');
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('count');

        // Load Pokémon list
        async function loadPokemonList() {
            try {
                const response = await fetch('/api/pokemon/list');
                if (response.ok) {
                    const data = await response.json();
                    allPokemon = data.species.map(name => ({
                        name: name,
                        searchName: name.toLowerCase()
                    }));
                    statusEl.textContent = '✅ Ready';
                    countEl.textContent = allPokemon.length;
                    console.log('Loaded', allPokemon.length, 'Pokémon');
                } else {
                    statusEl.textContent = '❌ API Error';
                }
            } catch (error) {
                statusEl.textContent = '❌ Connection Error';
                console.error('Failed to load Pokémon list:', error);
            }
        }

        // Autocomplete logic
        speciesInput.addEventListener('input', function() {
            const value = this.value.trim().toLowerCase();
            selectedSuggestionIndex = -1;

            console.log('Input value:', value, 'All Pokemon:', allPokemon.length);

            if (value.length === 0) {
                suggestionsList.classList.remove('open');
                suggestionsList.innerHTML = '';
                return;
            }

            if (allPokemon.length === 0) {
                console.warn('Pokemon list not loaded yet');
                return;
            }

            const filtered = allPokemon.filter(p => 
                p.searchName.includes(value)
            ).slice(0, 10);

            console.log('Filtered results:', filtered.length);

            if (filtered.length === 0) {
                suggestionsList.classList.remove('open');
                suggestionsList.innerHTML = '';
                return;
            }

            suggestionsList.innerHTML = filtered.map((pokemon, index) => `
                <div class="autocomplete-item" data-index="${index}" data-name="${pokemon.name}">
                    ${pokemon.name}
                </div>
            `).join('');

            suggestionsList.classList.add('open');

            // Add click handlers
            document.querySelectorAll('.autocomplete-item').forEach((item, index) => {
                item.addEventListener('click', function() {
                    speciesInput.value = this.dataset.name;
                    suggestionsList.classList.remove('open');
                    speciesInput.focus();
                });
                item.addEventListener('mouseenter', function() {
                    selectedSuggestionIndex = index;
                    updateSuggestionSelection(document.querySelectorAll('.autocomplete-item'));
                });
            });
        });

        // Keyboard navigation
        speciesInput.addEventListener('keydown', function(e) {
            const items = document.querySelectorAll('.autocomplete-item');
            
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, items.length - 1);
                updateSuggestionSelection(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
                updateSuggestionSelection(items);
            } else if (e.key === 'Enter') {
                if (selectedSuggestionIndex >= 0 && items[selectedSuggestionIndex]) {
                    e.preventDefault();
                    speciesInput.value = items[selectedSuggestionIndex].dataset.name;
                    suggestionsList.classList.remove('open');
                }
            } else if (e.key === 'Escape') {
                suggestionsList.classList.remove('open');
            }
        });

        function updateSuggestionSelection(items) {
            items.forEach((item, index) => {
                if (index === selectedSuggestionIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        // Close suggestions when clicking outside
        document.addEventListener('click', function(e) {
            if (e.target !== speciesInput && !e.target.closest('.autocomplete-suggestions')) {
                suggestionsList.classList.remove('open');
            }
        });

        // Load on page load
        loadPokemonList();
    </script>
</body>
</html>
